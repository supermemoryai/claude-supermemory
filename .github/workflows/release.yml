name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: "peak-ubuntu-24.04-4"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Skip a push that already contains a release
        id: gate
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log --format=%B "${{ github.event.before }}..${{ github.event.after }}" | grep -q 'chore(release):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.gate.outputs.skip != 'true'
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("fs");
            const version = require("./package.json").version;
            for (const file of ["plugin/.claude-plugin/plugin.json", "latest.json"]) {
              const next = fs.readFileSync(file, "utf8").replace(
                /"version":\s*"[^"]+"/,
                `"version": "${version}"`,
              );
              fs.writeFileSync(file, next);
            }
          '
          git add package.json package-lock.json plugin/.claude-plugin/plugin.json latest.json
          git commit -m "chore(release): ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Open release pull request
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="chore/release-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Release branch ${branch} already exists"
            exit 0
          fi
          git push origin "HEAD:${branch}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "{\"title\":\"chore(release): ${VERSION}\",\"head\":\"${branch}\",\"base\":\"main\",\"body\":\"Align package, plugin, and update-notice versions to ${VERSION}. main requires a pull request, so this workflow can no longer push the bump directly.\"}"
