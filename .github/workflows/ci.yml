name: CI

on:
  pull_request:

jobs:
  quality-checks:
    name: Lint & Test
    runs-on: "peak-ubuntu-24.04-4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome CI
        run: npx biome ci .

      - name: Verify bundled SDK
        run: npm run build:sdk && git diff --exit-code -- plugin/hooks/vendor/supermemory.cjs

      - name: Test
        run: npm test
